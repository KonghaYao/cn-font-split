[package]
name = "server"
version = "0.1.0"
edition = "2021"

[dependencies]
cn-font-split = { version = "7.2.1", default-features = false }
axum = { version = "0.8.1", features = [] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0.136"
tokio = { version = "1.0.136", features = ["full"] }
futures = "0.3.31"
cn-font-proto = { version = "0.2.0", default-features = false }
reqwest = { version = "0.12.12", features = ['multipart'] }
tower = { version = "0.5.2", features = ["util"] }
tower-http = { version = "0.6.1", features = ["full"] }
cn-font-utils = "0.2.0"
sha2 = "0.10.8"

[features]
default = ["with_extra"]
with_extra = ["cn-font-proto/with_extra", "cn-font-split/with_extra"]

[workspace]
