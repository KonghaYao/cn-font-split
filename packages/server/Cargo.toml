[package]
name = "server"
version = "0.1.0"
edition = "2021"

[dependencies]
cn-font-split = { version = "7.2.0", default-features = false }
axum = { version = "0.8.1", features = [] }
shuttle-axum = "0.51.0"
shuttle-runtime = "0.51.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0.68"
tokio = { version = "1.0", features = ["full"] }
futures = "0.3.31"
tokio-stream = "0.1.16"
async-stream = "0.3.6"
futures-util = "0.3.31"
cn-font-proto = { version = "0.1.2", default-features = false }
md5 = "0.7.0"
reqwest = { version = "0.12.12", features = ['multipart'] }

[features]
default = ["with_extra"]
with_extra = ["cn-font-proto/with_extra", "cn-font-split/with_extra"]

[workspace]
