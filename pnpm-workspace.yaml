packages:
  - packages/**
  - crates/**
# pnpm 11+ 用 allowBuilds 取代 onlyBuiltDependencies（旧字段会被静默忽略）。
# protobufjs 的历史行为是跳过构建脚本，这里显式拒绝，避免 install 因未决脚本失败。
allowBuilds:
  cn-font-split: true
  esbuild: true
  koffi: true
  protobufjs: false
overrides:
  cross-spawn: 7.0.5
  brace-expansion@>=1.0.0 <=1.1.11: ">=1.1.12"
  brace-expansion@>=2.0.0 <=2.0.1: ">=2.0.2"
  vite-plugin-static-copy@>=0.4.3 <=2.3.1: ">=2.3.2"
  vite@>=6.0.0 <=6.3.5: ">=6.3.6"
  vite@>=6.0.0 <=6.4.0: ">=6.4.1"
  # 视觉基线依赖固定浏览器版本：精确锁定，避免 WebKit 漂移导致基线失效。
  # 原安全 pin（playwright@<1.55.1: ">=1.55.1"）已被精确锁定覆盖。
  playwright: "1.65.1"
  playwright-core: "1.65.1"
  minimatch@<3.1.4: ">=3.1.4"
  picomatch@<2.3.2: ">=2.3.2"
  picomatch@>=4.0.0 <4.0.4: ">=4.0.4"
  serialize-javascript@<7.0.5: ">=7.0.5"
  lodash@<=4.17.23: ">=4.18.0"
  ajv@>=7.0.0-alpha.0 <8.18.0: ">=8.18.0"
