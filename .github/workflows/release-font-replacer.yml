name: release-font-replacer

# 默认 dry-run：inputs.publish=false 时只打包并执行 publish --dry-run。
on:
    workflow_dispatch:
        inputs:
            publish:
                description: "真实发布到 npm（默认 false，只 dry-run）"
                type: boolean
                default: false

permissions:
    contents: read

jobs:
    publish:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v5

            - uses: pnpm/action-setup@v4

            - uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: pnpm
                  registry-url: 'https://registry.npmjs.org'

            - run: pnpm install --frozen-lockfile

            - name: Build（显式构建，产物缺失时在此失败）
              # 包内 prepack 也会跑 pnpm build（pnpm pack / pnpm publish 都会执行 prepack），
              # 但把它提到发布步骤之前，可以让构建失败的报错出现在 publish 之前。
              working-directory: packages/font-replacer
              run: pnpm build

            - name: npm publish --dry-run（默认路径）
              if: ${{ !inputs.publish }}
              working-directory: packages/font-replacer
              run: pnpm publish --dry-run --access public --no-git-checks

            - name: npm publish（真实发布）
              if: ${{ inputs.publish }}
              working-directory: packages/font-replacer
              run: |
                  pnpm publish --dry-run --access public --no-git-checks
                  pnpm publish --access public --no-git-checks
              env:
                  NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
