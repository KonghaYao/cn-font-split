name: test-font-feature

# 字体特性冒烟：只使用仓库内 packages/demo/public 的本地字体，
# 不下载任何远程 CDN 字体，也不依赖已归档的 microsoft/playwright-github-action。
#
# 旧的 FeatureConfig 远程字体矩阵（高棉文、天城文等）需要联网下载，
# 已从 CI 移除；本地用例覆盖 CJK、可变字重（300/500/800）、第二中文字体。
on:
    workflow_dispatch:

permissions:
    contents: read

jobs:
    test:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout repository
              uses: actions/checkout@v5

            - uses: pnpm/action-setup@v4
              with:
                  version: 12

            - name: Set up Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: pnpm

            - uses: dtolnay/rust-toolchain@stable
              with:
                  toolchain: 1.85.0

            - uses: Swatinem/rust-cache@v2

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Install Playwright Chromium
              run: pnpm -C packages/test exec playwright install --with-deps chromium

            - name: Build native FFI
              run: cargo build --release -p ffi --locked

            - name: Build workspace packages
              run: pnpm build

            # 本地字体渲染冒烟：检查字体加载、截图非空、无 console error。
            - name: Local font feature smoke
              run: node packages/test/visual/run.mjs --browser=chromium --smoke

            - name: Upload smoke artifacts
              if: ${{ !cancelled() }}
              uses: actions/upload-artifact@v4
              with:
                  name: font-feature-smoke
                  path: packages/test/visual/out
                  if-no-files-found: ignore
                  retention-days: 7
