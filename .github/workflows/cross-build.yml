name: Rust Cross Build

# 手动触发的多平台构建。默认 dry-run：只构建并上传 artifact，不创建 release、
# 不发布 npm / crates.io。任何发布动作都必须显式打开 create_release。
on:
    workflow_dispatch:
        inputs:
            dry_run:
                description: "只构建并上传 artifacts（默认 true）"
                type: boolean
                default: true
            create_release:
                description: "创建 draft release（需要 dry_run=false，默认 false）"
                type: boolean
                default: false
            tag:
                description: "draft release 的 tag；留空使用当前 ref"
                required: false
                default: ""

permissions:
    contents: write

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

env:
    TZ: Asia/Shanghai
    HARFBUZZ_SYS_NO_PKG_CONFIG: "True"

jobs:
    build:
        name: Build - ${{ matrix.os-name }}
        runs-on: ${{ matrix.runs-on }}
        strategy:
            fail-fast: false
            matrix:
                include:
                    - os-name: macOS-aarch64
                      runs-on: macos-14
                      target: aarch64-apple-darwin
                      ext: dylib
                      cross: false

                    - os-name: macOS-x86_64
                      # GitHub 正在淘汰 macos-13：这里在 arm64 runner 上交叉编译
                      # x86_64-apple-darwin（target 与构建命令不变，只是换了 runner）。
                      runs-on: macos-14
                      target: x86_64-apple-darwin
                      ext: dylib
                      cross: false

                    - os-name: Linux-x86_64-gnu
                      runs-on: ubuntu-22.04
                      target: x86_64-unknown-linux-gnu
                      ext: so
                      cross: false

                    - os-name: Linux-aarch64-gnu
                      runs-on: ubuntu-22.04
                      target: aarch64-unknown-linux-gnu
                      ext: so
                      cross: true

                    # riscv64 / s390x 没有对应的 npm 平台包（`@cn-font-split/*` 只覆盖
                    # darwin-arm64/x64、win32-x64/arm64、linux-x64/arm64 与两个 wasm 目标）。
                    # 这两个目标构建出来只作为 GitHub Release 的附件（bindings-* artifact），
                    # 供自行设置 CN_FONT_SPLIT_BIN 的用户使用，不会进入 dist-platforms/。
                    - os-name: Linux-riscv64-gnu
                      runs-on: ubuntu-22.04
                      target: riscv64gc-unknown-linux-gnu
                      ext: so
                      cross: true

                    - os-name: Linux-s390x-gnu
                      runs-on: ubuntu-22.04
                      target: s390x-unknown-linux-gnu
                      ext: so
                      cross: true

                    - os-name: Windows-x86_64-msvc
                      runs-on: windows-latest
                      target: x86_64-pc-windows-msvc
                      ext: dll
                      cross: false

                    - os-name: Windows-aarch64-msvc
                      runs-on: windows-latest
                      target: aarch64-pc-windows-msvc
                      ext: dll
                      cross: false

        steps:
            - uses: actions/checkout@v5

            - uses: dtolnay/rust-toolchain@stable
              with:
                  toolchain: 1.85.0
                  targets: ${{ matrix.target }}

            - uses: Swatinem/rust-cache@v2
              with:
                  key: ${{ matrix.target }}

            - name: Install Linux build tools
              if: runner.os == 'Linux' && !matrix.cross
              run: |
                  sudo apt-get update
                  sudo apt-get install -y clang llvm pkg-config g++

            - name: Build (native target)
              if: ${{ !matrix.cross }}
              run: cargo build --locked --release -p ffi --no-default-features --target ${{ matrix.target }}

            # Linux 交叉目标用 cross（docker 提供 sysroot），保持与旧流程一致的产物。
            - name: Build (cross)
              if: ${{ matrix.cross }}
              uses: houseabsolute/actions-rust-cross@v1
              with:
                  command: build
                  target: ${{ matrix.target }}
                  args: "--locked --release -p ffi --no-default-features"
                  strip: false

            - name: Prepare artifact (Unix)
              if: runner.os != 'Windows'
              shell: bash
              run: |
                  src="target/${{ matrix.target }}/release/libffi.${{ matrix.ext }}"
                  cp "$src" "target/${{ matrix.target }}/release/libffi-${{ matrix.target }}.${{ matrix.ext }}"

            - name: Prepare artifact (Windows)
              if: runner.os == 'Windows'
              shell: pwsh
              run: |
                  $src = "target/${{ matrix.target }}/release/ffi.dll"
                  $dst = "target/${{ matrix.target }}/release/libffi-${{ matrix.target }}.dll"
                  Copy-Item $src $dst

            - name: Upload artifact
              # 所有目标（含无 npm 平台包的 riscv64 / s390x）都只上传 artifact；
              # 若显式 create_release，它们会作为 release 附件，仍不进 npm。
              uses: actions/upload-artifact@v4
              with:
                  name: bindings-${{ matrix.target }}
                  path: target/${{ matrix.target }}/release/libffi-${{ matrix.target }}.*
                  if-no-files-found: error
                  retention-days: 14

    build-wasm:
        name: Build - WASM (${{ matrix.wasm-target }})
        runs-on: ubuntu-24.04
        strategy:
            fail-fast: false
            matrix:
                include:
                    - wasm-target: wasm32-wasip1
                      optimize: true
                    - wasm-target: wasm32-wasip2
                      optimize: false
        steps:
            - uses: actions/checkout@v5

            - uses: dtolnay/rust-toolchain@stable
              with:
                  toolchain: 1.85.0
                  targets: ${{ matrix.wasm-target }}

            - name: Install Linux build tools
              run: |
                  sudo apt-get update
                  sudo apt-get install -y clang llvm pkg-config g++ cmake

            - name: Setup WASI SDK / binaryen
              run: |
                  sudo sh ./.devcontainer/wasi-install.sh
                  sudo sh ./.devcontainer/wasm-opt-install.sh

            - name: Build
              working-directory: ./packages/wasm-edge
              run: |
                  export WASI_SYSROOT="/opt/wasi-sdk/wasi-sdk-27.0-x86_64-linux/share/wasi-sysroot/"
                  export PATH=$PATH:/opt/binaryen/binaryen-version_124/bin
                  export WASI_SDK_PATH="/opt/wasi-sdk/wasi-sdk-27.0-x86_64-linux/"
                  cargo build --target ${{ matrix.wasm-target }} --release --locked

            - name: Optimize WASM
              if: ${{ matrix.optimize }}
              working-directory: ./packages/wasm-edge
              run: |
                  export PATH=$PATH:/opt/binaryen/binaryen-version_124/bin
                  wasm-opt -Oz \
                      --output ../../target/${{ matrix.wasm-target }}/release/wasm_edge.Oz.wasm \
                      ../../target/${{ matrix.wasm-target }}/release/wasm_edge.wasm

            - name: Prepare artifact
              run: |
                  if [ "${{ matrix.optimize }}" = "true" ]; then
                      src="./target/${{ matrix.wasm-target }}/release/wasm_edge.Oz.wasm"
                  else
                      src="./target/${{ matrix.wasm-target }}/release/wasm_edge.wasm"
                  fi
                  cp "$src" "./target/${{ matrix.wasm-target }}/release/libffi-${{ matrix.wasm-target }}.wasm"

            - name: Upload artifact
              uses: actions/upload-artifact@v4
              with:
                  name: bindings-${{ matrix.wasm-target }}
                  path: ./target/${{ matrix.wasm-target }}/release/libffi-${{ matrix.wasm-target }}.wasm
                  if-no-files-found: error
                  retention-days: 14

    create-release:
        name: Create draft release
        runs-on: ubuntu-latest
        needs: [build, build-wasm]
        # 只有显式要求创建 release 且不是 dry-run 时才执行；永不 publish 到 npm/crates。
        if: ${{ inputs.create_release && !inputs.dry_run }}
        steps:
            - uses: actions/download-artifact@v4
              with:
                  path: ./artifacts
                  merge-multiple: true

            - name: Display structure of downloaded files
              run: ls -R ./artifacts

            - name: Create draft release
              uses: softprops/action-gh-release@v2
              with:
                  tag_name: ${{ inputs.tag || github.ref_name }}
                  name: ${{ inputs.tag || github.ref_name }}
                  draft: true
                  prerelease: true
                  files: artifacts/**/*
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
