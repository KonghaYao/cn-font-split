[package]
name = "lang-unicodes"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Effortlessly convert and validate text across various Unicode ranges, supporting multiple languages for seamless internationalization in your applications."
authors.workspace = true
homepage.workspace = true
repository.workspace = true
license.workspace = true
include = ["data", "src"]

[dependencies]
cn-font-utils.workspace = true


[dev-dependencies]
# 仅供 examples/gen_unicodes.rs 重新生成 data/*.dat 使用（opencc-rs 依赖 cmake）
opencc-rs = "0.4.7"


[lib]
path = "src/lib.rs"

[features]
default = ["with_extra"]
# 保留空 feature：8.0 起数据文件已入库，默认构建不再需要任何额外依赖
with_extra = []
