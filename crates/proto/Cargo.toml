[package]
name = "cn-font-proto"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "proto of cn-font-split"
authors.workspace = true
homepage.workspace = true
repository.workspace = true
license.workspace = true
include = ["src/**/*"]

[dependencies]
tonic = { version = "0.13.1", optional = true }
prost = "0.13.5"
prost-types = { version = "0.13.5", optional = true }
# 仅供 examples/gen_proto.rs 重新生成 src/lib 使用（运行时需要 protoc）。
# 通过 `regen` feature 显式开启，默认构建与测试不会编译它。
tonic-build = { version = "0.13.1", optional = true }

[features]
default = ["with_extra"]
server = ["tonic"]
# 保留空 feature：8.0 起生成代码已入库，默认构建不再需要 tonic-build/protoc
with_extra = []
# 重新生成 src/lib/*.rs 时才需要（要求 PATH 中有 protoc）
regen = ["dep:tonic-build"]

[lib]
path = "src/lib/mod.rs"

[[example]]
name = "gen_proto"
required-features = ["regen"]
