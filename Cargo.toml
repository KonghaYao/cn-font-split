[package]
name = "cn-font-split"
description = "划时代的字体切割工具，CJK与任何字符！支持 otf、ttf、woff2 字体多线程切割，完美地细颗粒度地进行包大小控制。A revolutionary font subetter that supports CJK and any characters! It enables multi-threaded subset of otf, ttf, and woff2 fonts, allowing for precise control over package size."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
homepage.workspace = true
repository.workspace = true
license.workspace = true
exclude = ["packages", "assets", ".devcontainer", ".github", ".vscode", "examples"]

[dependencies]
cn-font-utils.workspace = true
harfbuzz_rs_now = "2.3.2"
lang-unicodes.workspace = true
log = "0.4.35"
blake3 = "1.8.7"
# 注意：opentype 0.39 依赖 truetype 0.48，其中 0.48.3 使用了
# `slice::as_chunks`（Rust 1.88+ 才稳定），在 MSRV 1.85 上无法编译，
# 因此 Cargo.lock 中固定 truetype = 0.48.2。
opentype = "0.39.1"
prost = "0.13.5"
thiserror = "2.0.21"
cn-font-proto.workspace = true
rayon = "1.12.0"
unicode-range.workspace = true
woff = "0.4.0"
current_platform = "0.2.0"
clap = { version = "4.6.10", features = ["derive"] }
chrono = "0.4.45"
regex = "1.13.2"
indexmap = "2.14.2"

[dev-dependencies]
env_logger = "0.11.12"

[features]
default = ["with_extra"]
with_extra = ["lang-unicodes/with_extra", "cn-font-proto/with_extra"]

[workspace]
members = [
    "crates/cn_font_utils",
    "crates/lang_unicodes",
    "crates/proto",
    "crates/unicode_range",
    "packages/wasmer",
    "packages/ffi",
    "packages/grpc",
    "packages/wasm-edge",
]

[workspace.package]
version = "8.0.0"
edition = "2024"
rust-version = "1.85"
license = "Apache-2.0"
authors = ["KonghaYao<3446798488@qq.com>"]
homepage = "https://chinese-font.netlify.app/"
repository = "https://github.com/konghaYao/cn-font-split"

[workspace.dependencies]
# default-features 只能在 workspace 声明，成员里再用 `default-features = false` 会报错。
cn-font-split = { version = "8.0.0", path = ".", default-features = false }
cn-font-utils = { version = "8.0.0", path = "crates/cn_font_utils" }
lang-unicodes = { version = "8.0.0", path = "crates/lang_unicodes", default-features = false }
cn-font-proto = { version = "8.0.0", path = "crates/proto", default-features = false }
unicode-range = { version = "8.0.0", path = "crates/unicode_range" }

[profile.release]
lto = true

[[bin]]
name = "cn-font-split"
path = "./src/main.rs"
